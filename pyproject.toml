[project]
name = "smartmyodoo"
version = "0.1.0"
description = "SmartMyOdoo: AI assistant for Odoo ERP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.7.0"
]

[project.scripts]
smartmyodoo = "smartmyodoo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
