[project]
name = "smartmyodoo"
version = "0.1.0"
description = "SmartMyOdoo: AI assistant for Odoo ERP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.7.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "litellm>=1.40",
    "redis>=5.0.0",
    "markitdown[all]>=0.1.6"
]

[project.scripts]
smartmyodoo = "smartmyodoo.__main__:main"

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "pytest>=8.0.0",
    "fakeredis[lua]>=2.20.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B110", "B603", "B607", "B404"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "smartmyodoo"]
# e2e wykluczone domyślnie: wymagają żywego serwera+chromium i zostawiają działającą
# pętlę zdarzeń, która psuła kolejne testy async (test pollution). Uruchom jawnie: pytest -m e2e
addopts = "-m 'not e2e'"
norecursedirs = ["custom_addons", ".venv", "node_modules", "*.egg", "build", "dist"]
markers = [
    "e2e: testy end-to-end wymagające żywego serwera + przeglądarki (uruchamiaj jawnie: pytest -m e2e)",
]

[tool.coverage.run]
source = ["smartmyodoo"]
omit = ["*/test_*.py", "tests/*", "*/__main__.py"]
